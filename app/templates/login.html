<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Gfilas</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f6f8fc; font-family: system-ui, sans-serif; color: #172033; }
    main { width: 100%; max-width: 440px; background: white; border: 1px solid #dce3ef; border-radius: 18px; padding: 32px; }
    .brand { color: #2563eb; font-weight: 700; letter-spacing: .15em; }
    h1 { font-size: 1.7rem; margin: 12px 0; }
    p { color: #526078; line-height: 1.5; }
    label { display: block; margin: 18px 0 6px; font-weight: 600; }
    input { width: 100%; border: 1px solid #aebbd0; border-radius: 8px; padding: 12px; font: inherit; }
    button { width: 100%; margin-top: 24px; background: #2563eb; color: white; border: 0; border-radius: 8px; padding: 13px; font: inherit; cursor: pointer; }
    a { color: #2158b6; }
    .notice { background: #fff4d6; padding: 12px; border-radius: 8px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">GFILAS</div>
    <h1>Entrar na unidade</h1>
    <p>Use o login e a senha fornecidos pelo administrador.</p>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="notice" role="alert">{{ message }}</p>
    {% endfor %}
    <form method="post">
      <input type="hidden" name="form_token" value="{{ form_token }}">
      <label for="login">Login</label>
      <input id="login" name="login" required autocomplete="username" maxlength="100" value="{{ request.form.get('login', '') }}">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" required maxlength="200" autocomplete="current-password">
      <button type="submit">Entrar</button>
    </form>

  </main>
</body>
</html>
